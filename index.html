<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <title>SPMB SMPS Al-Hadiid Cileungsi</title>
    <meta name="description" content="Sistem Penerimaan Murid Baru Online SMP Al-Hadiid Cileungsi" />
    <meta property="og:title" content="SPMB SMPS Al-Hadiid Cileungsi" />
    <meta property="og:description" content="Sistem Penerimaan Murid Baru Online SMP Al-Hadiid Cileungsi" />
    <script>
      // Canvas and prototype defensive guards for iframe sandboxes
      try {
        if (typeof HTMLCanvasElement !== 'undefined' && !HTMLCanvasElement.prototype.getBoundingClientRect) {
          HTMLCanvasElement.prototype.getBoundingClientRect = function() {
            return {
              top: 0, left: 0, right: this.width || 0, bottom: this.height || 0,
              width: this.width || 0, height: this.height || 0, x: 0, y: 0, toJSON: function() {}
            };
          };
        }
      } catch (e) {}

      // Prevent unhandled promise rejections and script errors from bubbling to outer iframe
      window.addEventListener('unhandledrejection', function(event) {
        var reasonStr = (event && (event.reason?.message || event.reason || '')) + '';
        console.warn('[Global Unhandled Rejection Caught]:', reasonStr);
        if (reasonStr.indexOf('getBoundingClientRect') !== -1 || reasonStr.indexOf('canvas') !== -1) {
          if (event.preventDefault) event.preventDefault();
          return;
        }
        if (event.preventDefault) event.preventDefault();
      });
      window.addEventListener('error', function(event) {
        var errStr = (event && (event.message || event.error?.message || '')) + '';
        console.warn('[Global Error Caught]:', errStr);
        if (errStr.indexOf('getBoundingClientRect') !== -1 || errStr.indexOf('canvas') !== -1) {
          if (event.preventDefault) event.preventDefault();
          return true;
        }
      });
      window.onerror = function(msg) {
        var str = (msg || '') + '';
        if (str.indexOf('getBoundingClientRect') !== -1) {
          return true;
        }
      };

      // Sandbox safety for alert, confirm, prompt, open in iframe
      try {
        var origAlert = window.alert;
        window.alert = function(msg) {
          try {
            if (origAlert) origAlert.call(window, msg);
          } catch (e) {
            console.warn('[Iframe Sandbox] alert suppressed:', msg);
          }
        };
        var origConfirm = window.confirm;
        window.confirm = function(msg) {
          try {
            if (origConfirm) return origConfirm.call(window, msg);
          } catch (e) {
            console.warn('[Iframe Sandbox] confirm suppressed:', msg);
            return true;
          }
          return true;
        };
        var origOpen = window.open;
        window.open = function(url, target, features) {
          try {
            if (origOpen) return origOpen.call(window, url, target, features);
          } catch (e) {
            console.warn('[Iframe Sandbox] window.open suppressed:', url);
            return null;
          }
          return null;
        };
      } catch (e) {
        // ignore
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" crossorigin src="/src/main.tsx"></script>
  </body>
</html>
